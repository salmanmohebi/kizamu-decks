[project]
name = "kizamu-decks"
version = "0.1.0"
description = "Anki decks with audio for German (vocabulary, grammar, sentences) and American English (C1-C2), and the pipeline that builds them."
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "anki==26.9.3",
    "chevron>=0.14",
    "genanki>=0.13",
    "markdown>=3.5",
    "pyyaml>=6.0",
    "requests>=2.31",
    "wordfreq>=3.1",
]

[dependency-groups]
# Audio (Qwen3-TTS + Whisper check) and local content generation. Needs an NVIDIA GPU.
gpu = [
    "accelerate==1.12.0",
    "numpy>=2.0",
    "qwen-tts==0.1.1",
    "soundfile==0.14.0",
    "torch>=2.5",
    "transformers==4.57.3",
]
# Pilot audio and drafts on Apple Silicon (MLX).
mac = [
    "mlx-audio==0.5.9; sys_platform == 'darwin'",
    "mlx-lm; sys_platform == 'darwin'",
]

[tool.uv]
package = false
